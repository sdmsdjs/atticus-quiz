      // Polyfill global for libraries that expect it
      if (typeof global === 'undefined') {
        window.global = window;
      }
      
      // Fix for 'Cannot set property fetch of #<Window>'
      // Some libraries try to polyfill fetch by assignment, which fails on modern browsers
      // where window.fetch is a read-only getter.
      const originalFetch = window.fetch;
      try {
        Object.defineProperty(window, 'fetch', {
          value: originalFetch,
          writable: true,
          configurable: true
        });
      } catch (e) {
        console.warn('Could not make window.fetch writable, some libraries might fail if they try to overwrite it.');
      }
    </script>
